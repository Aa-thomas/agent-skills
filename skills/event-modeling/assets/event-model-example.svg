<svg xmlns="http://www.w3.org/2000/svg" width="2110" height="1220" viewBox="0 0 2110 1220" role="img" aria-labelledby="title description">
  <title id="title">Event Model: export an immutable document revision</title>
  <desc id="description">A left-to-right timeline with human screens, automation and external actors, command and read-model cards, Export-owned events, and an external renderer fact. RequestExport produces ExportRequested. ExportStatus shows pending. PendingExports feeds a worker that submits RenderDocument. The external RenderSucceeded fact is translated into CompleteExport, producing ExportCompleted. Later views show a download link and no pending work. Concrete contracts and alternate scenarios are in the linked Event Modeling reference.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#42516a"/></marker>
    <style>
      text { font-family: sans-serif; fill: #172238; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #46536a; }
      .lane { font-size: 18px; font-weight: 700; }
      .heading { font-size: 19px; font-weight: 700; }
      .data { font-size: 17px; }
      .small { font-size: 15px; fill: #46536a; }
      .card { stroke-width: 2; rx: 8; }
      .screen { fill: #fff; stroke: #738096; }
      .actor { fill: #eee8f7; stroke: #7c639e; }
      .command { fill: #d9eaff; stroke: #2d609b; }
      .view { fill: #ddf2e6; stroke: #3a7457; }
      .event { fill: #ffe1b6; stroke: #a85b14; }
      .edge { fill: none; stroke: #42516a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="2110" height="1220" fill="#fff"/>
  <text x="32" y="44" class="title">Event Model · document export</text>
  <text x="32" y="77" class="subtitle">Illustrative specification · Document supplies doc-7/v3; authentication supplies u-7 · Full fields and scenarios: references/event-modeling.md</text>
  <path d="M180 137 H2055" class="edge"/>
  <g class="heading">
    <text x="180" y="119">1 · Request</text><text x="500" y="119">2 · Pending</text>
    <text x="820" y="119">3 · Work due</text><text x="1140" y="119">4 · Render</text>
    <text x="1460" y="119">5 · Accept result</text><text x="1780" y="119">6 · Ready</text>
  </g>
  <rect x="165" y="156" width="1905" height="182" rx="8" fill="#f4f6fa"/>
  <rect x="165" y="352" width="1905" height="151" rx="8" fill="#f6f2fa"/>
  <rect x="165" y="536" width="1905" height="247" rx="8" fill="#f5f8fa"/>
  <rect x="165" y="797" width="1905" height="167" rx="8" fill="#fff5e8"/>
  <rect x="165" y="1023" width="1905" height="131" rx="8" fill="#fbf6ef"/>
  <g class="lane">
    <text x="24" y="188">Author</text><text x="24" y="212">screens</text>
    <text x="24" y="387">System</text><text x="24" y="411">actors</text>
    <text x="24" y="573">Commands</text><text x="24" y="597">and views</text>
    <text x="24" y="835">Export</text><text x="24" y="859">owns events</text>
    <text x="24" y="1061">Renderer</text><text x="24" y="1085">owns fact</text>
  </g>
  <!-- Arrows express information flow; the rail above expresses time. -->
  <g>
    <path d="M315 320 V560" class="edge"/>
    <path d="M315 695 V814" class="edge"/>
    <path d="M450 851 H635 V695" class="edge"/>
    <path d="M450 887 H955 V695" class="edge"/>
    <path d="M635 560 V320" class="edge"/>
    <path d="M955 560 V485" class="edge"/>
    <path d="M1090 425 H1115 V620 H1140" class="edge"/>
    <path d="M1275 560 V485" class="edge"/>
    <path d="M1410 425 H1434 V996 H1275 V1040" class="edge"/>
    <path d="M1410 1090 H1752 V425 H1730" class="edge"/>
    <path d="M1595 485 V560" class="edge"/>
    <path d="M1595 695 V814" class="edge"/>
    <path d="M1730 851 H2082 V702 H2020 V695" class="edge"/>
    <path d="M1730 911 H2000 V773" class="edge"/>
    <path d="M1915 560 V320" class="edge"/>
  </g>
  <g id="S1">
    <rect x="180" y="173" width="270" height="147" class="card screen"/>
    <text x="194" y="200" class="heading">S1 · Export document</text>
    <text x="194" y="226" class="data">doc-7 · revision 3</text>
    <text x="194" y="251" class="data">Format: PDF</text>
    <text x="194" y="276" class="data">[ Request export ]</text>
    <text x="194" y="301" class="small">client retains request_id=req-9</text>
  </g>
  <g id="S2">
    <rect x="500" y="173" width="270" height="147" class="card screen"/>
    <text x="514" y="200" class="heading">S2 · Export pending</text>
    <text x="514" y="232" class="data">Export ex-42</text>
    <text x="514" y="260" class="data">Preparing your PDF…</text>
    <text x="514" y="293" class="small">No download link yet</text>
  </g>
  <g id="S3">
    <rect x="1780" y="173" width="270" height="147" class="card screen"/>
    <text x="1794" y="200" class="heading">S3 · Export ready</text>
    <text x="1794" y="232" class="data">Export ex-42</text>
    <text x="1794" y="260" class="data">[ Download PDF ]</text>
    <text x="1794" y="293" class="small">/exports/ex-42.pdf</text>
  </g>
  <g id="A1">
    <rect x="820" y="369" width="270" height="116" class="card actor"/>
    <text x="834" y="397" class="heading">A1 · Renderer worker</text>
    <text x="834" y="428" class="data">For each pending export</text>
    <text x="834" y="457" class="small">submit its exact revision</text>
  </g>
  <g id="renderer">
    <rect x="1140" y="369" width="270" height="116" class="card actor" stroke-dasharray="6 4"/>
    <text x="1154" y="397" class="heading">External renderer</text>
    <text x="1154" y="428" class="data">Render doc-7/v3 as PDF</text>
    <text x="1154" y="457" class="small">owns the external outcome</text>
  </g>
  <g id="A2">
    <rect x="1460" y="369" width="270" height="116" class="card actor"/>
    <text x="1474" y="397" class="heading">A2 · Result translator</text>
    <text x="1474" y="428" class="data">Validate source and URI</text>
    <text x="1474" y="457" class="small">job_ref → export_id</text>
  </g>
  <g id="C1">
    <rect x="180" y="560" width="270" height="135" class="card command"/>
    <text x="194" y="587" class="heading">C1 · RequestExport</text>
    <text x="194" y="614" class="data">doc-7 / v3 / pdf</text>
    <text x="194" y="641" class="data">req-9 · actor u-7</text>
    <text x="194" y="672" class="small">Export admits; assigns ex-42</text>
  </g>
  <g id="V1-pending">
    <rect x="500" y="560" width="270" height="135" class="card view"/>
    <text x="514" y="587" class="heading">V1 · ExportStatus</text>
    <text x="514" y="614" class="data">ex-42 · state: pending</text>
    <text x="514" y="641" class="data">download_path: null</text>
    <text x="514" y="672" class="small">from E1 · reader u-7</text>
  </g>
  <g id="V2-pending">
    <rect x="820" y="560" width="270" height="135" class="card view"/>
    <text x="834" y="587" class="heading">V2 · PendingExports</text>
    <text x="834" y="614" class="data">ex-42 · doc-7 / v3 / pdf</text>
    <text x="834" y="641" class="data">one unfinished job</text>
    <text x="834" y="672" class="small">from E1 without matching E2</text>
  </g>
  <g id="C2">
    <rect x="1140" y="560" width="270" height="135" class="card command"/>
    <text x="1154" y="587" class="heading">C2 · RenderDocument</text>
    <text x="1154" y="614" class="data">job_ref: ex-42</text>
    <text x="1154" y="641" class="data">doc-7 / v3 / pdf</text>
    <text x="1154" y="672" class="small">external command · retry key</text>
  </g>
  <g id="C3">
    <rect x="1460" y="560" width="270" height="135" class="card command"/>
    <text x="1474" y="587" class="heading">C3 · CompleteExport</text>
    <text x="1474" y="614" class="data">export_id: ex-42</text>
    <text x="1474" y="641" class="data">/exports/ex-42.pdf</text>
    <text x="1474" y="672" class="small">Export checks and accepts</text>
  </g>
  <g id="V1-ready">
    <rect x="1780" y="560" width="270" height="135" class="card view"/>
    <text x="1794" y="587" class="heading">V1 · ExportStatus</text>
    <text x="1794" y="614" class="data">ex-42 · state: ready</text>
    <text x="1794" y="641" class="data">/exports/ex-42.pdf</text>
    <text x="1794" y="672" class="small">E1 + E2 · reader u-7</text>
  </g>
  <g id="V2-empty">
    <rect x="1780" y="711" width="270" height="62" class="card view"/>
    <text x="1794" y="738" class="heading">V2 · PendingExports</text>
    <text x="1794" y="761" class="small">later read: [] · E1 + E2</text>
  </g>
  <g id="E1">
    <rect x="180" y="814" width="270" height="135" class="card event"/>
    <text x="194" y="841" class="heading">E1 · ExportRequested</text>
    <text x="194" y="868" class="data">ex-42 · req-9 · u-7</text>
    <text x="194" y="895" class="data">doc-7 / v3 / pdf</text>
    <text x="194" y="926" class="small">fact: request was accepted</text>
  </g>
  <g id="E2">
    <rect x="1460" y="814" width="270" height="135" class="card event"/>
    <text x="1474" y="841" class="heading">E2 · ExportCompleted</text>
    <text x="1474" y="868" class="data">export_id: ex-42</text>
    <text x="1474" y="895" class="data">/exports/ex-42.pdf</text>
    <text x="1474" y="926" class="small">fact: result was accepted</text>
  </g>
  <g id="X1">
    <rect x="1140" y="1040" width="270" height="98" class="card event" stroke-dasharray="6 4"/>
    <text x="1154" y="1067" class="heading">X1 · RenderSucceeded</text>
    <text x="1154" y="1095" class="data">job_ref: ex-42</text>
    <text x="1154" y="1121" class="data">uri: /exports/ex-42.pdf</text>
  </g>
  <text x="180" y="1185" class="subtitle">Blue = command · Orange = event/fact · Green = read model · Purple = system actor · White = screen · Dashed = external ownership</text>
  <text x="180" y="1210" class="small">Alternative scenarios, field origins, example-only guarantees, and implementation boundaries are recorded in the companion reference.</text>
</svg>
